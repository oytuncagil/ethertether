# SHA-256 of the release signing certificate, as apksigner and the About screen show it (colons
# allowed). The release workflow refuses an APK signed with another certificate (docs/RELEASING.md).
ethertether.releaseCertSha256=75:37:BE:B7:0C:8E:EF:0E:39:88:1F:A9:BC:4A:1C:37:DE:FC:97:86:29:AC:DE:4E:A3:85:B8:24:31:1D:05:7B
# Every test run compares the screenshot tests with their reference images (app/build.gradle.kts).
roborazzi.test.verify=true
