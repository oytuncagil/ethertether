version = 1

# Plain-text files that cannot carry a comment header.
[[annotations]]
path = ["NOTICE", "gradle/wrapper/gradle-wrapper.properties"]
SPDX-FileCopyrightText = "2026 Oytun Cagil Koltuk"
SPDX-License-Identifier = "Apache-2.0 OR GPL-3.0-or-later"

# Future store metadata and JSON files (no comment syntax).
[[annotations]]
path = ["fastlane/metadata/**", "**/*.json"]
SPDX-FileCopyrightText = "2026 Oytun Cagil Koltuk"
SPDX-License-Identifier = "Apache-2.0 OR GPL-3.0-or-later"

# Gradle wrapper, generated by Gradle 9.8.1: Apache-2.0 only.
[[annotations]]
path = ["gradle/wrapper/gradle-wrapper.jar", "gradlew", "gradlew.bat"]
precedence = "override"
SPDX-FileCopyrightText = "the original authors of Gradle"
SPDX-License-Identifier = "Apache-2.0"

# Reference images of the screenshot tests (images cannot carry a header).
[[annotations]]
path = ["app/src/test/screenshots/**"]
SPDX-FileCopyrightText = "2026 Oytun Cagil Koltuk"
SPDX-License-Identifier = "Apache-2.0 OR GPL-3.0-or-later"
